version: '3.8'

services:
  bot:
    build: .
    container_name: aquamaster_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./app.db:/app/app.db
      - ./logs:/app/logs
      - ./media:/app/media
    environment:
      - TZ=Asia/Tashkent

